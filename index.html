<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chai, biryani, and the in-between. A personal food diary, mostly from Hyderabad." />
    <meta name="theme-color" content="#f7f3eb" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TiredRice" />
    <meta property="og:title" content="TiredRice — Chai & biryani. And the rest." />
    <meta
      property="og:description"
      content="A personal food diary. Mostly Hyderabad, sometimes elsewhere."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TiredRice — Chai & biryani. And the rest." />
    <meta
      name="twitter:description"
      content="A personal food diary. Mostly Hyderabad, sometimes elsewhere."
    />
    <link rel="icon" type="image/svg+xml" href="images/tiredrice-mark.svg" />
    <title>TiredRice — Chai &amp; biryani. And the rest.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="#home" aria-label="TiredRice home">
        <img class="wordmark-icon" src="images/tiredrice-mark.svg" alt="" />
        <span>tired<span class="wordmark-rice">rice</span></span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <a class="nav-link nav-link-active" href="#reviews">Reviews <span aria-hidden="true">↓</span></a>
      </nav>
    </header>

    <main id="home">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="hero-kicker"><span aria-hidden="true">✳</span> my little food diary</p>
          <h1 id="hero-title">Chai &amp; biryani.<br /><span>And the rest.</span></h1>
          <p class="hero-description">
            Mostly Hyderabad. Sometimes elsewhere.
          </p>
        </div>

        <div class="hero-art">
          <div class="hero-image-wrap">
            <img
              class="hero-image"
              src="https://images.unsplash.com/photo-1589302168068-964664d93dc0?auto=format&fit=crop&w=1100&q=85"
              alt="A generous plate of fragrant biryani"
              fetchpriority="high"
            />
          </div>
        </div>
      </section>

      <section class="reviews-section" id="reviews" aria-labelledby="reviews-title">
        <div class="section-heading">
          <div>
            <h2 id="reviews-title">Recent eats</h2>
          </div>
        </div>

        <div class="review-toolbar">
          <div class="filter-row" role="group" aria-label="Filter my food diary entries">
            <button class="filter-chip is-active" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-chip" type="button" data-filter="chai" aria-pressed="false">☕ Chai</button>
            <button class="filter-chip" type="button" data-filter="sweet" aria-pressed="false">🍦 Sweet</button>
            <button class="filter-chip" type="button" data-filter="biryani" aria-pressed="false">🍛 Biryani</button>
            <button class="filter-chip" type="button" data-filter="chaat" aria-pressed="false">🥣 Chaat</button>
            <button class="filter-chip" type="button" data-filter="rice" aria-pressed="false">🍚 Rice</button>
            <button class="filter-chip" type="button" data-filter="tiffin" aria-pressed="false">🥞 Tiffin</button>
            <button class="filter-chip" type="button" data-filter="snacks" aria-pressed="false">🥟 Snacks</button>
          </div>
          <label class="review-search">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <span class="visually-hidden">Search places, dishes, or notes</span>
            <input
              type="search"
              id="review-search"
              aria-label="Search places, dishes, or notes"
              placeholder="Find a place or dish…"
              autocomplete="off"
            />
            <kbd>/</kbd>
          </label>
        </div>

        <div class="review-grid" aria-live="polite" aria-relevant="additions removals"></div>
        </div>
        <p class="empty-state" hidden>No bites found. Try another place or dish.</p>
      </section>

    </main>

    <footer class="site-footer">
      <a class="wordmark footer-wordmark" href="#home">
        <img class="wordmark-icon" src="images/tiredrice-mark.svg" alt="" />
        <span>tired<span class="wordmark-rice">rice</span></span>
      </a>
      <p>A little food diary <span aria-hidden="true">♡</span></p>
    </footer>
  </body>
</html>
